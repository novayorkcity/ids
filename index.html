<body>

<div class="container">

<h1>Compra de ID - Nova RolePlay</h1>

<div class="box">

<button id="btnEnviar" onclick="enviarPedido()">Enviar Pedido</button>

</div>

<script>
    // Bloqueia o clique com o botão direito
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado como Ctrl+S (Salvar) e Ctrl+U (Ver código fonte)
    document.onkeydown = function(e) {
        if (e.ctrlKey && (e.keyCode === 83 || e.keyCode === 85 || e.keyCode === 73)) {
            return false;
        }
    };

const webhookURL = "https://discord.com/api/webhooks/1478622345324138498/aRKdMNCJuccy3BBNLiBmw-R3AvcU6E-WAlfIuHBx7P33U23CB2qCo8uhDl4oJ9oNKeYF";

let idsUsados = [246, 396, 627];

fetch("ids.json")
.then(res => res.json())
.then(data =>{

idsUsados = data.ids_usados;

gerarIDsLista();

});

function validarIDDiscord(id){

id = id.replace(/\D/g,'');

if(!/^\d{17,20}$/.test(id)){
return false;
}

return true;

}

function calcularPreco(id){

if(id>=1 && id<=5) return 300;
if(id>=6 && id<=20) return 250;
if(id>=21 && id<=50) return 130;
if(id>=51 && id<=100) return 100;
if(id>=101 && id<=300) return 85;
if(id>=301 && id<=500) return 70;
if(id>=501 && id<=800) return 45;
if(id>=801 && id<=1000) return 30;

return null;

}

function verificarID(){

let id = parseInt(document.getElementById("iddesejado").value);
let resultado = document.getElementById("resultado");

if(!id){
resultado.innerHTML="";
return;
}

if(idsUsados.includes(id)){

resultado.innerHTML="❌ Esse ID já está em uso.";
return;

}

let preco = calcularPreco(id);

if(preco === null){

resultado.innerHTML="Esse ID ainda não está dispnivel para compra.";
return;

}

resultado.innerHTML="✅ ID disponível | Valor: R$ "+preco;

}

function proximaEtapa(){

document.getElementById("etapa1").style.display="none";
document.getElementById("etapa2").style.display="block";

}

function voltarEtapa(){

document.getElementById("etapa1").style.display="block";
document.getElementById("etapa2").style.display="none";

}

function gerarPedido(){

let letras="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let numeros="0123456789";
let chars=letras+numeros;

let codigo="NRP-ID-";

for(let i=0;i<6;i++){

codigo+=chars.charAt(Math.floor(Math.random()*chars.length));

}

return codigo;

}

  const tempoBloqueio = 60000;

function podeEnviarPedido(){
    let ultimoPedido = localStorage.getItem("ultimoPedidoID");

    if(!ultimoPedido) return true;

    let agora = Date.now();
    let diferenca = agora - ultimoPedido;

    if(diferenca < tempoBloqueio){
        let restante = Math.ceil((tempoBloqueio - diferenca)/1000);
        alert("⚠️ Aguarde " + restante + " segundos para enviar outro pedido.");
        return false;
    }

    return true;
}

function iniciarContador(){
    const botao = document.getElementById("btnEnviar");
    let ultimoPedido = localStorage.getItem("ultimoPedidoID");

    if(!ultimoPedido) return;

    function atualizar(){
        let agora = Date.now();
        let diferenca = agora - ultimoPedido;

        if(diferenca < tempoBloqueio){
            let restante = Math.ceil((tempoBloqueio - diferenca)/1000);

            botao.disabled = true;
            botao.innerText = "Aguarde " + restante + "s...";
        } else {
            botao.disabled = false;
            botao.innerText = "Enviar Pedido";
            clearInterval(intervalo);
        }
    }

    atualizar();
    let intervalo = setInterval(atualizar, 1000);
}

function enviarPedido(){

  if(!podeEnviarPedido()) return;

let nick = document.getElementById("nick").value;
let idconta = document.getElementById("idconta").value;
let iddesejado = parseInt(document.getElementById("iddesejado").value);
let discord = document.getElementById("discord").value;

if(!nick || !idconta || !iddesejado || !discord){

alert("Preencha todos os campos.");
return;

}

if(idsUsados.includes(iddesejado)){

alert("Esse ID já está em uso.");
return;

}

if(!validarIDDiscord(discord)){

alert("ID do Discord inválido.");
return;

}

let preco = calcularPreco(iddesejado);

let pedidoID = gerarPedido();

fetch(webhookURL,{

method:"POST",
headers:{ "Content-Type":"application/json" },

body:JSON.stringify({

content:

"💙 **__NOVA ROLEPLAY - PEDIDO DE COMPRA DE ID__**\n"+
"🧾 **ID DO PEDIDO:** `" + pedidoID + "`\n\n" +

"👤 **NICK:** "+nick+"\n"+
"🆔 **ID ATUAL:** "+idconta+"\n"+
"🎯 **ID DESEJADO:** "+iddesejado+"\n"+
"💰 **VALOR:** R$ "+preco+"\n"+
"🤖 **DISCORD:** <@"+discord+">\n\n"+
  "<@&1482460048524574942>\n"+
  "<@&1474052698121834506>\n"

})

});

  localStorage.setItem("ultimoPedidoID", Date.now());
iniciarContador();

    alert("✅Pedido enviado com sucesso!\n\n"+
          " ID DO PEDIDO: "+pedidoID+"\n"+
          " Guarde o ID do pedido, você irá precisar.");

}

function gerarIDsLista(){
  
  let totalIDs = 1000;
let usados = idsUsados.length;
let livres = totalIDs - usados;

document.getElementById("contadorIDs").innerText =
"IDs disponíveis: " + livres;

let container = document.getElementById("listaIDs");

container.innerHTML = "";

for(let i=1;i<=1000;i++){

let div = document.createElement("div");

div.className = "id-item";

div.innerText = i;

if(idsUsados.includes(i)){

div.classList.add("id-usado");

}else{

div.classList.add("id-disponivel");

/* CLICAR NO ID */
div.onclick = function(){

document.getElementById("iddesejado").value = i;

voltarEtapa();

verificarID();

};

}

container.appendChild(div);

}

}

gerarIDsLista();

  window.onload = function(){
    iniciarContador();
  }

</script>

</body>
</html>
